<svg width="100%" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wL{animation:wL .6s ease-in-out infinite alternate;transform-origin:168px 295px}
      .wR{animation:wR .6s ease-in-out infinite alternate;transform-origin:232px 295px}
      @keyframes wL{0%{transform:rotate(-5deg);opacity:.88}100%{transform:rotate(25deg) scaleX(.65);opacity:.5}}
      @keyframes wR{0%{transform:rotate(5deg);opacity:.88}100%{transform:rotate(-25deg) scaleX(.65);opacity:.5}}
      .arm{animation:arm 1.2s ease-in-out infinite alternate;transform-origin:258px 285px}
      @keyframes arm{0%{transform:rotate(-8deg)}100%{transform:rotate(22deg)}}
      .blink{animation:blink 4s ease-in-out infinite;transform-origin:200px 185px}
      @keyframes blink{0%,44%,56%,100%{transform:scaleY(1)}50%{transform:scaleY(0.06)}}
      .body{animation:float 2.8s ease-in-out infinite;transform-origin:200px 300px}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      .sp{animation:sp 2s ease-in-out infinite}.sp2{animation:sp 2s .75s ease-in-out infinite}.sp3{animation:sp 2s 1.4s ease-in-out infinite}
      @keyframes sp{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
    </style>
  </defs>

  <!-- sparkles outside body group so they float separately -->
  <g class="sp"><path d="M98 141 L100 149 L108 150 L100 152 L98 160 L96 152 L88 150 L96 149Z" fill="#B5B82A"/></g>
  <g class="sp2"><path d="M312 118 L314 123 L319 125 L314 127 L312 132 L310 127 L305 125 L310 123Z" fill="#B5B82A"/></g>
  <g class="sp3"><path d="M318 181 L319 184 L322 185 L319 187 L318 190 L317 187 L314 185 L317 184Z" fill="#9C173C"/></g>

  <!-- Everything floats together inside .body -->
  <g class="body">
    <g class="wL">
      <ellipse cx="155" cy="278" rx="58" ry="26" fill="#D8DB32" opacity=".88" transform="rotate(-55,155,278)"/>
      <ellipse cx="145" cy="308" rx="40" ry="18" fill="#C4C72B" opacity=".72" transform="rotate(-30,145,308)"/>
      <line x1="163" y1="272" x2="118" y2="252" stroke="#8F9218" stroke-width="1" opacity=".65"/>
      <line x1="158" y1="283" x2="115" y2="275" stroke="#8F9218" stroke-width="1" opacity=".65"/>
    </g>
    <g class="wR">
      <ellipse cx="245" cy="278" rx="58" ry="26" fill="#D8DB32" opacity=".88" transform="rotate(55,245,278)"/>
      <ellipse cx="255" cy="308" rx="40" ry="18" fill="#C4C72B" opacity=".72" transform="rotate(30,255,308)"/>
      <line x1="237" y1="272" x2="282" y2="252" stroke="#8F9218" stroke-width="1" opacity=".65"/>
      <line x1="242" y1="283" x2="285" y2="275" stroke="#8F9218" stroke-width="1" opacity=".65"/>
    </g>
    <ellipse cx="200" cy="315" rx="42" ry="52" fill="#9C173C"/>
    <ellipse cx="200" cy="300" rx="42" ry="9" fill="#74102C" opacity=".45"/>
    <ellipse cx="200" cy="317" rx="42" ry="9" fill="#74102C" opacity=".4"/>
    <rect x="180" y="258" width="40" height="22" rx="0" fill="#9C173C"/>
    <polygon points="180,268 200,298 220,268 214,268 200,293 186,268" fill="#D8DB32"/>
    <rect x="162" y="350" width="76" height="10" rx="5" fill="#D8DB32"/>
    <ellipse cx="152" cy="300" rx="20" ry="12" fill="#9C173C" transform="rotate(-28,152,300)"/>
    <ellipse cx="136" cy="318" rx="16" ry="11" fill="#9C173C" transform="rotate(-38,136,318)"/>
    <circle cx="126" cy="330" r="15" fill="#9C173C"/>
    <ellipse cx="152" cy="300" rx="20" ry="12" fill="none" stroke="#74102C" stroke-width="5" transform="rotate(-28,152,300)"/>
    <g class="arm">
      <ellipse cx="248" cy="294" rx="20" ry="12" fill="#9C173C" transform="rotate(28,248,294)"/>
      <ellipse cx="264" cy="312" rx="16" ry="11" fill="#9C173C" transform="rotate(38,264,312)"/>
      <circle cx="274" cy="324" r="15" fill="#9C173C"/>
      <ellipse cx="248" cy="294" rx="20" ry="12" fill="none" stroke="#74102C" stroke-width="5" transform="rotate(28,248,294)"/>
    </g>
    <ellipse cx="181" cy="368" rx="18" ry="24" fill="#9C173C"/>
    <ellipse cx="219" cy="368" rx="18" ry="24" fill="#9C173C"/>
    <ellipse cx="178" cy="388" rx="24" ry="12" fill="#B5B82A"/>
    <ellipse cx="220" cy="388" rx="24" ry="12" fill="#B5B82A"/>
    <circle cx="200" cy="195" r="72" fill="#9C173C"/>
    <ellipse cx="200" cy="173" rx="72" ry="14" fill="#74102C" opacity=".4"/>
    <ellipse cx="200" cy="193" rx="72" ry="13" fill="#74102C" opacity=".34"/>
    <ellipse cx="200" cy="205" rx="46" ry="38" fill="#D7A2AD" opacity=".4"/>
    <g class="blink">
      <circle cx="174" cy="192" r="24" fill="white"/>
      <circle cx="226" cy="192" r="24" fill="white"/>
      <circle cx="176" cy="195" r="18" fill="#1a0a12"/>
      <circle cx="228" cy="195" r="18" fill="#1a0a12"/>
      <circle cx="176" cy="195" r="11" fill="#0d0509"/>
      <circle cx="228" cy="195" r="11" fill="#0d0509"/>
      <circle cx="168" cy="186" r="7" fill="white"/>
      <circle cx="220" cy="186" r="7" fill="white"/>
      <circle cx="181" cy="193" r="3.5" fill="white" opacity=".7"/>
      <circle cx="233" cy="193" r="3.5" fill="white" opacity=".7"/>
    </g>
    <path d="M178 222 Q190 238 200 240 Q210 238 222 222" fill="none" stroke="#1a0a12" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M185 226 Q192 237 200 238 Q208 237 215 226" fill="white"/>
    <ellipse cx="155" cy="215" rx="13" ry="9" fill="#C46B82" opacity=".33"/>
    <ellipse cx="245" cy="215" rx="13" ry="9" fill="#C46B82" opacity=".33"/>
    <circle cx="200" cy="125" r="11" fill="#9C173C"/>
  </g>
</svg>
